name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Verify Python syntax and compilation
        run: |
          python -m compileall backend core -q

      - name: Run Backend Unit & Integration Tests
        run: |
          pytest backend/tests tests -v --tb=short

  frontend-ci:
    name: Frontend Lint, Tests, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Run Frontend Tests
        working-directory: frontend
        run: |
          npm test -- --run

      - name: TypeScript Type Checking
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Production Vite Build
        working-directory: frontend
        run: |
          npm run build

  kubernetes-validate:
    name: Validate Kubernetes & Compose Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for YAML validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Kubernetes Manifests Syntax & Schema
        run: |
          python -c "
          import os, glob, yaml
          manifest_dir = 'deploy/kubernetes'
          files = glob.glob(os.path.join(manifest_dir, '*.yaml'))
          assert files, 'No kubernetes manifests found in ' + manifest_dir
          for f in sorted(files):
              with open(f, 'r') as fh:
                  docs = list(yaml.safe_load_all(fh))
                  for doc in docs:
                      if not doc:
                          continue
                      assert 'apiVersion' in doc, f'Missing apiVersion in {f}'
                      assert 'kind' in doc, f'Missing kind in {f}'
                      assert 'metadata' in doc, f'Missing metadata in {f}'
                      assert 'name' in doc['metadata'], f'Missing metadata.name in {f}'
              print(f'Validated: {f}')
          print(f'Successfully validated {len(files)} Kubernetes manifests.')
          "

      - name: Validate Docker Compose Configuration
        run: |
          python -c "
          import yaml
          with open('compose.yaml') as fh:
              data = yaml.safe_load(fh)
          assert 'services' in data, 'Missing services in compose.yaml'
          assert 'backend' in data['services'], 'Missing backend service'
          assert 'frontend' in data['services'], 'Missing frontend service'
          print('Successfully validated compose.yaml structure.')
          "

  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: adaptive-studio-backend:ci-test

      - name: Build Frontend Docker Image (Test)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: adaptive-studio-frontend:ci-test
