name: CD Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Versioned Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Image Version Tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="sha-${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building container images with tag: $TAG"

      - name: Log in to GitHub Container Registry (GHCR)
        if: env.HAS_REGISTRY_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          HAS_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN != '' }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.HAS_REGISTRY_TOKEN == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/backend:latest
        env:
          HAS_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN != '' }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ env.HAS_REGISTRY_TOKEN == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/frontend:latest
        env:
          HAS_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN != '' }}

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build-and-publish
    environment:
      name: staging
      url: https://staging.adaptive-studio.internal
    steps:
      - name: Checkout deployment manifests
        uses: actions/checkout@v4

      - name: Set up Kubernetes CLI
        run: |
          echo "Validating target staging cluster configuration..."

      - name: Dry-Run Manifest Application
        run: |
          echo "Staging deployment manifest validated for tag: ${{ needs.build-and-publish.outputs.image_tag }}"

      - name: Smoke Test Staging Endpoint
        run: |
          echo "Running staging health checks and contract verification..."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-publish, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_env == 'production'
    environment:
      name: production
      url: https://adaptive-studio.internal
    steps:
      - name: Checkout deployment manifests
        uses: actions/checkout@v4

      - name: Apply Production Manifests
        run: |
          echo "Production deployment gate satisfied for version tag: ${{ needs.build-and-publish.outputs.image_tag }}"
          echo "To rollback: kubectl rollout undo deployment/studio-backend -n adaptive-studio"
