apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-frontend
  namespace: adaptive-studio
  labels:
    app.kubernetes.io/name: adaptive-studio
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: adaptive-studio
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaptive-studio
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: frontend
          image: ghcr.io/adaptive-studio/frontend:0.10.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
