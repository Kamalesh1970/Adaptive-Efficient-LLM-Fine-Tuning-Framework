apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-network-policy
  namespace: adaptive-studio
  labels:
    app.kubernetes.io/name: adaptive-studio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic within the namespace
    - from:
        - podSelector: {}
    # Allow ingress controller traffic to frontend and backend services
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow intra-namespace traffic
    - to:
        - podSelector: {}
    # Allow HTTPS egress for model / dataset downloading (e.g., Hugging Face)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
