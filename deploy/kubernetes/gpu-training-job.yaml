apiVersion: batch/v1
kind: Job
metadata:
  name: studio-gpu-training-job
  namespace: adaptive-studio
  labels:
    app.kubernetes.io/name: adaptive-studio
    app.kubernetes.io/component: gpu-training-worker
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaptive-studio
        app.kubernetes.io/component: gpu-training-worker
    spec:
      restartPolicy: Never
      # Toleration for dedicated GPU node taints
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      # Target nodes advertising NVIDIA GPU capacity
      nodeSelector:
        accelerator: nvidia-gpu
      containers:
        - name: gpu-worker
          image: ghcr.io/adaptive-studio/backend-gpu:0.10.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: studio-config
          env:
            - name: TRAINING_RUN_ID
              value: "run_gpu_placeholder"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          resources:
            requests:
              cpu: "4000m"
              memory: "16Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8000m"
              memory: "32Gi"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: artifacts-storage
              mountPath: /app/artifacts
      volumes:
        - name: artifacts-storage
          persistentVolumeClaim:
            claimName: studio-artifacts-pvc
