apiVersion: batch/v1
kind: Job
metadata:
  name: studio-training-job
  namespace: adaptive-studio
  labels:
    app.kubernetes.io/name: adaptive-studio
    app.kubernetes.io/component: training-worker
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaptive-studio
        app.kubernetes.io/component: training-worker
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: training-worker
          image: ghcr.io/adaptive-studio/backend:0.10.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: studio-config
          env:
            - name: TRAINING_RUN_ID
              value: "run_placeholder"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: artifacts-storage
              mountPath: /app/artifacts
      volumes:
        - name: artifacts-storage
          persistentVolumeClaim:
            claimName: studio-artifacts-pvc
