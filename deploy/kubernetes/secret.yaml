apiVersion: v1
kind: Secret
metadata:
  name: studio-secrets
  namespace: adaptive-studio
  labels:
    app.kubernetes.io/name: adaptive-studio
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Sensitive Hugging Face Hub token (replace with real secret in target cluster)
  HUGGING_FACE_HUB_TOKEN: "REPLACE_WITH_YOUR_HF_TOKEN"
  # S3 / Object storage secret key (if remote artifact backup is enabled)
  STORAGE_SECRET_KEY: "REPLACE_WITH_STORAGE_KEY"
